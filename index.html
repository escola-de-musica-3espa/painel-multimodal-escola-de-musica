<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Multimodal - Escola de Música</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.9.2/core.js"></script>

    <!-- Estilos do projeto -->
    <link rel="stylesheet" href="src/css/estilo.css">
</head>
<body>
    <header class="cabecalho">
        <h1>🎵 Escola de Música</h1>
        <p>Painel Multimodal</p>
    </header>

    <main class="painel">
        <!-- Catálogo de instrumentos (preenchido pelo Python) -->
        <section class="card card-largo" id="secao-instrumentos">
            <h2>Instrumentos</h2>
            <div class="grid-instrumentos" id="lista-instrumentos">
                <p class="carregando">Carregando Python...</p>
            </div>
        </section>

        <!-- Guardrails: validação de entrada -->
        <section class="card" id="secao-guardrails">
            <h2>Busca com Guardrails</h2>
            <input type="text" id="entrada-busca" placeholder="Digite um instrumento...">
            <button id="btn-buscar" py-click="buscar">Buscar</button>
            <p id="resultado-busca"></p>
        </section>

        <!-- Embeddings: Norma Euclidiana -->
        <section class="card" id="secao-embeddings">
            <h2>Similaridade (Norma Euclidiana)</h2>
            <select id="instrumento-a"></select>
            <select id="instrumento-b"></select>
            <button id="btn-calcular" py-click="calcular_distancia">Calcular</button>
            <p id="resultado-embedding"></p>
        </section>

        <!-- Telemetria -->
        <section class="card" id="secao-telemetria">
            <h2>Telemetria</h2>
            <ul id="log-telemetria"></ul>
        </section>
    </main>

    <footer class="rodape">
        <p>FIAP · Engenharia de Software · 3ESPA</p>
    </footer>

    <!-- Script Python -->
    <script type="py" src="src/python/main.py"
        config='{"packages": ["numpy"], "files": {"src/python/dados.json": "dados.json"}}'></script>
</body>
</html>
