<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel multimodal para uma escola de musica.">
    <title>Painel Multimodal | Escola de Musica</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <link rel="stylesheet" href="src/css/estilo.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <header class="cabecalho">
        <p class="etiqueta">Checkpoint 2 - IA & ML</p>
        <h1>Escola de Musica</h1>
        <p>Painel multimodal de instrumentos, telemetria e embeddings.</p>
    </header>

    <main class="painel">
        <section class="cartao" aria-labelledby="titulo-instrumentos">
            <h2 id="titulo-instrumentos">Instrumentos</h2>
            <div id="lista-instrumentos" class="grade">
                <p>Aguardando a implementacao da base de instrumentos.</p>
            </div>
        </section>

        <section class="cartao" aria-labelledby="titulo-telemetria">
            <h2 id="titulo-telemetria">Telemetria</h2>
            <p id="status" aria-live="polite">Carregando o modulo Python...</p>
        </section>
    </main>

    <footer>
        <p>FIAP - Engenharia de Software - 3ESPA</p>
    </footer>

    <script type="py" src="src/python/main.py" config='{"packages":["numpy"]}'></script>
</body>
</html>
